<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptis Listening - Question 14</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-canvas: #f3f4f6;
        }
        body { 
            background: var(--bg-canvas); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #1f2937;
        }
        .main-card { 
            background: #ffffff; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); 
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }
        .audio-bar { 
            background: var(--primary-color); 
            color: white; 
            padding: 16px 24px; 
        }
        .question-item { 
            padding: 14px 18px; 
            border-bottom: 1px solid #f3f4f6; 
            cursor: pointer; 
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
        }
        .question-item:hover { 
            background: #f8fafc; 
        }
        .question-item.active { 
            background: #eef2ff; 
            border-left-color: var(--primary-color);
            font-weight: 600;
        }
        .person-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s ease;
        }
        .person-card.correct {
            border-color: #10b981;
            background-color: #f0fdf4;
        }
        .person-card.incorrect {
            border-color: #ef4444;
            background-color: #fef2f2;
        }
        .transcript-box { 
            background: #ffffff; 
            border: 1px solid #cbd5e1; 
            border-radius: 12px; 
            padding: 20px; 
            line-height: 1.6;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        /* Custom kiểu dáng cho thanh Seekbar */
        .audio-seekbar {
            height: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container py-4" style="max-width: 1100px;">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h2 class="fw-bold m-0" style="color: #111827;">Aptis Listening</h2>
                <small class="text-muted">Part 4: Matching opinions / statements (Question 14)</small>
            </div>
            <span class="badge bg-white text-dark border px-3 py-2 fs-6 rounded-pill shadow-sm">
                <i class="bi bi-collection-play me-1 text-primary"></i>
                <span id="completedCount">0</span>/<span id="totalNum">0</span> Hoàn thành
            </span>
        </div>

        <div class="main-card">
            <!-- Audio Bar với Seekbar -->
            <div class="audio-bar">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <div class="d-flex align-items-center gap-3">
                        <button id="playBtn" class="btn btn-light rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 44px; height: 44px;">
                            <i class="bi bi-play-fill fs-4 text-primary"></i>
                        </button>
                        <div>
                            <div class="fw-bold">Topic <span id="currentNum">1</span></div>
                            <small class="opacity-75" id="audioStatus">Sẵn sàng phát audio</small>
                        </div>
                    </div>
                    <!-- Thời gian phát -->
                    <div class="small fw-semibold opacity-90">
                        <span id="currentTime">00:00</span> / <span id="durationTime">00:00</span>
                    </div>
                </div>

                <!-- Thanh tua audio -->
                <div class="d-flex align-items-center gap-2">
                    <input type="range" id="seekBar" class="form-range audio-seekbar flex-grow-1" value="0" min="0" max="100" step="0.1">
                </div>

                <audio id="audioPlayer" style="display:none;"></audio>
            </div>

            <div class="row g-0">
                <!-- Sidebar Question List -->
                <div class="col-md-4 border-end bg-white">
                    <div class="p-3 border-bottom">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <span class="d-none"></span>
                            <input type="text" id="searchInput" class="form-control bg-light border-start-0" placeholder="Tìm kiếm topic...">
                        </div>
                    </div>
                    <div id="questionList" class="custom-scroll" style="max-height: 600px; overflow-y: auto;"></div>
                </div>

                <!-- Main Question Content -->
                <div class="col-md-8 d-flex flex-column justify-content-between">
                    <div class="p-4">
                        <h4 class="fw-bold mb-1" id="topicTitle">Loading...</h4>
                        <p class="text-muted small mb-4">Lắng nghe audio và chọn ý kiến/thông tin tương ứng cho từng người (4 đáp án đúng trong 6 lựa chọn).</p>
                        
                        <div id="optionsContainer" class="d-flex flex-column gap-3"></div>
                    </div>

                    <!-- Transcript & Action Bar -->
                    <div class="px-4 pb-4">
                        <button class="btn btn-link text-decoration-none p-0 mb-3 text-secondary" id="transcriptBtn">
                            <i class="bi bi-file-text me-1"></i> <span id="transcriptBtnText">Hiện Transcript</span>
                        </button>
                        <div id="transcriptBox" class="transcript-box mb-3" style="display:none;"></div>

                        <div id="resultAlert" class="alert d-none mb-3" role="alert"></div>

                        <div class="d-flex justify-content-between gap-2 pt-3 border-top">
                            <button id="prevBtn" class="btn btn-outline-secondary px-4"><i class="bi bi-arrow-left me-1"></i> Câu trước</button>
                            <button id="checkBtn" class="btn btn-success px-4"><i class="bi bi-check-circle me-1"></i> Kiểm tra</button>
                            <button id="nextBtn" class="btn btn-primary px-4">Câu tiếp <i class="bi bi-arrow-right ms-1"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let userAnswers = [];
        let shuffledOptions = [];

        async function loadData() {
            try {
                const res = await fetch('listening_question14.json');
                questions = await res.json();
                
                userAnswers = new Array(questions.length).fill(null).map(() => ({}));
                shuffledOptions = questions.map(q => shuffle([...q.options]));

                document.getElementById('totalNum').textContent = questions.length;
                
                renderQuestionList();
                renderCurrentQuestion();
            } catch (e) {
                alert("Không thể tải dữ liệu file listening_question14.json!");
            }
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderQuestionList(filterText = '') {
            const list = document.getElementById('questionList');
            list.innerHTML = '';
            
            questions.forEach((q, i) => {
                if (filterText && !q.topic.toLowerCase().includes(filterText.toLowerCase())) {
                    return;
                }

                const isDone = userAnswers[i] && Object.keys(userAnswers[i]).length === 4 && Object.values(userAnswers[i]).every(v => v !== "");
                const div = document.createElement('div');
                div.className = `question-item d-flex align-items-center justify-content-between ${i === currentIndex ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="text-truncate me-2">
                        <span class="me-1">${i + 1}.</span>
                        <span>${q.topic}</span>
                    </div>
                    ${isDone ? '<i class="bi bi-check-circle-fill text-success"></i>' : ''}
                `;
                div.onclick = () => { 
                    if (currentIndex !== i) {
                        stopAudio();
                        currentIndex = i; 
                        renderQuestionList(filterText); 
                        renderCurrentQuestion(); 
                    }
                };
                list.appendChild(div);
            });
            updateProgress();
        }

        function renderCurrentQuestion() {
            const q = questions[currentIndex];
            document.getElementById('currentNum').textContent = currentIndex + 1;
            document.getElementById('topicTitle').textContent = q.topic;
            
            document.getElementById('resultAlert').classList.add('d-none');
            document.getElementById('transcriptBox').style.display = 'none';
            document.getElementById('transcriptBtnText').textContent = 'Hiện Transcript';

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            const persons = ['Person 1', 'Person 2', 'Person 3', 'Person 4'];
            const currentShuffled = shuffledOptions[currentIndex];

            persons.forEach((person, pIdx) => {
                const card = document.createElement('div');
                card.className = 'person-card';
                card.id = `card-p${pIdx}`;
                
                let optionsHTML = `<option value="">-- Chọn đáp án cho ${person} --</option>`;
                currentShuffled.forEach((optText) => {
                    const selected = userAnswers[currentIndex][pIdx] === optText ? 'selected' : '';
                    optionsHTML += `<option value="${optText.replace(/"/g, '&quot;')}" ${selected}>${optText}</option>`;
                });

                card.innerHTML = `
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="fw-bold text-primary">${person}</span>
                        <span id="feedback-p${pIdx}"></span>
                    </div>
                    <select class="form-select border-1" id="select-p${pIdx}">
                        ${optionsHTML}
                    </select>
                    <div id="correct-ans-p${pIdx}" class="small text-success mt-2 d-none"></div>
                `;
                
                container.appendChild(card);

                const select = card.querySelector('select');
                select.onchange = (e) => {
                    userAnswers[currentIndex][pIdx] = e.target.value;
                    renderQuestionList(document.getElementById('searchInput').value);
                };
            });

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === questions.length - 1;
        }

        // Kiểm tra kết quả
        document.getElementById('checkBtn').addEventListener('click', () => {
            const q = questions[currentIndex];
            let score = 0;
            
            for (let i = 0; i < 4; i++) {
                const selectedVal = userAnswers[currentIndex][i];
                const expectedVal = q.options[i];
                
                const card = document.getElementById(`card-p${i}`);
                const feedback = document.getElementById(`feedback-p${i}`);
                const correctAnsBox = document.getElementById(`correct-ans-p${i}`);
                
                card.classList.remove('correct', 'incorrect');
                
                if (selectedVal && selectedVal === expectedVal) {
                    score++;
                    card.classList.add('correct');
                    feedback.innerHTML = '<span class="badge bg-success"><i class="bi bi-check-lg"></i> Đúng</span>';
                    correctAnsBox.classList.add('d-none');
                } else {
                    card.classList.add('incorrect');
                    feedback.innerHTML = '<span class="badge bg-danger"><i class="bi bi-x-lg"></i> Sai</span>';
                    correctAnsBox.innerHTML = `<i class="bi bi-info-circle me-1"></i>Đáp án đúng: <strong>${expectedVal}</strong>`;
                    correctAnsBox.classList.remove('d-none');
                }
            }

            const alertBox = document.getElementById('resultAlert');
            alertBox.className = `alert ${score === 4 ? 'alert-success' : 'alert-warning'} d-block`;
            alertBox.innerHTML = `<strong>Kết quả:</strong> Bạn đạt <strong>${score}/4</strong> điểm cho chủ đề này.`;
        });

        // -------------------------------------------------------------
        // XỬ LÝ AUDIO & THANH TUA (SEEKBAR)
        // -------------------------------------------------------------
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const audioStatus = document.getElementById('audioStatus');
        const seekBar = document.getElementById('seekBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        // Hàm đổi giây sang mm:ss
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === 0) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Bấm nút Play/Pause
        playBtn.addEventListener('click', () => {
            const currentAudioUrl = questions[currentIndex]?.audioUrl || '';
            if (!audio.src || !audio.src.includes(currentAudioUrl)) {
                audio.src = currentAudioUrl;
            }
            
            if (audio.paused) {
                audio.play().then(() => {
                    playBtn.innerHTML = '<i class="bi bi-pause-fill fs-4 text-primary"></i>';
                    audioStatus.textContent = 'Đang phát audio...';
                }).catch(() => alert("Không thể tải tệp âm thanh!"));
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="bi bi-play-fill fs-4 text-primary"></i>';
                audioStatus.textContent = 'Đã tạm dừng';
            }
        });

        // Cập nhật tổng thời lượng audio khi file sẵn sàng
        audio.addEventListener('loadedmetadata', () => {
            durationTimeEl.textContent = formatTime(audio.duration);
            seekBar.max = audio.duration;
        });

        // Cập nhật Seekbar liên tục theo thời gian phát
        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                seekBar.value = audio.currentTime;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        // Sự kiện KÉO/BẤM VÀO THANH TUA (Seekbar)
        seekBar.addEventListener('input', () => {
            audio.currentTime = seekBar.value;
            currentTimeEl.textContent = formatTime(seekBar.value);
        });

        // Khi kết thúc Audio
        audio.onended = () => {
            playBtn.innerHTML = '<i class="bi bi-play-fill fs-4 text-primary"></i>';
            audioStatus.textContent = 'Đã phát xong';
            seekBar.value = 0;
            currentTimeEl.textContent = "00:00";
        };

        // Reset Audio khi đổi câu hỏi
        function stopAudio() {
            audio.pause();
            audio.currentTime = 0;
            playBtn.innerHTML = '<i class="bi bi-play-fill fs-4 text-primary"></i>';
            audioStatus.textContent = 'Sẵn sàng phát audio';
            seekBar.value = 0;
            currentTimeEl.textContent = "00:00";
            durationTimeEl.textContent = "00:00";
        }

        // -------------------------------------------------------------
        // CÁC TÍNH NĂNG PHỤ
        // -------------------------------------------------------------
        document.getElementById('transcriptBtn').addEventListener('click', () => {
            const box = document.getElementById('transcriptBox');
            const btnText = document.getElementById('transcriptBtnText');
            const isHidden = box.style.display === 'none';
            
            box.textContent = questions[currentIndex].transcript || "Không có transcript cho câu hỏi này.";
            box.style.display = isHidden ? 'block' : 'none';
            btnText.textContent = isHidden ? 'Ẩn Transcript' : 'Hiện Transcript';
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderQuestionList(e.target.value);
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) {
                stopAudio();
                currentIndex--;
                renderQuestionList(document.getElementById('searchInput').value);
                renderCurrentQuestion();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < questions.length - 1) {
                stopAudio();
                currentIndex++;
                renderQuestionList(document.getElementById('searchInput').value);
                renderCurrentQuestion();
            }
        });

        function updateProgress() {
            const completed = userAnswers.filter(ans => Object.keys(ans).length === 4 && Object.values(ans).every(v => v !== "")).length;
            document.getElementById('completedCount').textContent = completed;
        }

        window.onload = loadData;
    </script>
</body>
</html>
