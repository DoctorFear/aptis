<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptis Grammar Test - Full</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-body: #f8fafc;
            --card-radius: 16px;
        }
        body {
            background-color: var(--bg-body);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #1e293b;
            padding-bottom: 60px;
        }
        
        /* Header Box */
        .header-box {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            border-radius: var(--card-radius);
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(13, 110, 253, 0.25);
        }

        /* Stats & Control Sticky Bar */
        .stats-bar {
            position: sticky;
            top: 15px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid #e2e8f0;
            border-radius: 50rem;
            padding: 10px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .main-card {
            background: white;
            border-radius: var(--card-radius);
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            padding: 25px;
        }

        /* Question Card Style */
        .question-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-left: 5px solid var(--primary-color);
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .question-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
        }

        /* Options Style */
        .option {
            padding: 12px 18px;
            margin: 8px 0;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid #f1f5f9;
            background: #f8fafc;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .option:hover:not(.disabled) {
            border-color: var(--primary-color);
            background: #eff6ff;
            color: var(--primary-color);
        }
        
        /* State Status */
        .option.selected-correct {
            background-color: #d1e7dd !important;
            border-color: #0f5132 !important;
            color: #0f5132 !important;
            font-weight: 600;
        }
        .option.selected-wrong {
            background-color: #f8d7da !important;
            border-color: #842029 !important;
            color: #842029 !important;
        }
        .option.disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }

        .feedback {
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .part-header {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-top: 30px;
            margin-bottom: 20px;
            color: #0f172a;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container" style="max-width: 900px;">
        
        <!-- Header -->
        <div class="header-box text-center mt-4">
            <h1 class="fw-bold fs-2 mb-1"><i class="bi bi-journal-check me-2"></i>Aptis Grammar Test</h1>
            <p class="mb-0 text-white-50">Luyện tập từ vựng & ngữ pháp Aptis chuẩn định dạng</p>
        </div>

        <!-- Sticky Status & Controls Bar -->
        <div class="stats-bar d-flex justify-content-between align-items-center">
            <div class="d-flex gap-3 align-items-center">
                <span class="badge bg-primary-subtle text-primary fw-semibold px-3 py-2 rounded-pill fs-6" id="progressBadge">
                    <i class="bi bi-check2-circle me-1"></i>Đã làm: 0/0
                </span>
            </div>
            <div class="d-flex gap-2">
                <button id="resetBtn" class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-semibold">
                    <i class="bi bi-arrow-counterclockwise me-1"></i> Làm lại
                </button>
                <button id="scoreBtn" class="btn btn-success btn-sm rounded-pill px-3 fw-semibold">
                    <i class="bi bi-award me-1"></i> Xem Kết Quả
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-card">
            <h4 class="fw-bold text-primary mb-4 text-center border-bottom pb-3">Grammar Practice Section</h4>
            <div id="partsContainer">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted">Đang tải dữ liệu câu hỏi...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Kết Quả -->
    <div class="modal fade" id="scoreModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold fs-4">🎯 Kết Quả Bài Làm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <div class="display-3 fw-bold text-primary mb-2" id="modalScoreText">0/0</div>
                    <p class="fs-5 text-secondary mb-3" id="modalPercentText">Chính xác: 0%</p>
                    <div class="progress mb-3" style="height: 10px;">
                        <div id="modalProgressBar" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                    </div>
                    <p class="text-muted small mb-0" id="modalEvaluation">Hãy tiếp tục phát huy nhé!</p>
                </div>
                <div class="modal-footer border-0 pt-0 justify-content-center">
                    <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let data = {};
        let userAnswers = {};
        let shuffledOptionsCache = {};
        let totalQuestionsCount = 0;

        async function loadData() {
            try {
                const res = await fetch('grammar_1.json');
                data = await res.json();
                renderAll();
            } catch (e) {
                console.error(e);
                document.getElementById('partsContainer').innerHTML = `
                    <div class="alert alert-danger text-center rounded-3">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        Không tìm thấy hoặc không đọc được file <strong>grammar_1.json</strong>!
                    </div>`;
            }
        }

        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function getCorrectAnswer(q) {
            if (q.correct_answer) return q.correct_answer;
            return q.question_answer[0];
        }

        function getCleanOptions(q) {
            return q.question_answer.filter(opt => opt !== "");
        }

        function updateProgressBar() {
            const answeredCount = Object.keys(userAnswers).length;
            document.getElementById('progressBadge').innerHTML = 
                `<i class="bi bi-check2-circle me-1"></i>Đã làm: ${answeredCount}/${totalQuestionsCount}`;
        }

        function createOption(text, correctText, cacheKey, index) {
            const div = document.createElement('div');
            div.className = 'option';
            
            const textSpan = document.createElement('span');
            textSpan.textContent = text;
            div.appendChild(textSpan);

            const iconSpan = document.createElement('span');
            iconSpan.className = 'status-icon';
            div.appendChild(iconSpan);

            div.onclick = () => {
                const parent = div.parentElement;
                
                // Tránh chọn lại câu đã trả lời
                if (parent.classList.contains('answered')) return;
                parent.classList.add('answered');

                const isCorrect = text === correctText;
                div.classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
                iconSpan.innerHTML = isCorrect 
                    ? '<i class="bi bi-check-circle-fill text-success fs-5"></i>' 
                    : '<i class="bi bi-x-circle-fill text-danger fs-5"></i>';

                // Làm mờ các option khác & highlight đáp án đúng nếu chọn sai
                parent.querySelectorAll('.option').forEach(o => {
                    o.classList.add('disabled');
                    if (!isCorrect && o.textContent.trim() === correctText) {
                        o.classList.add('selected-correct');
                    }
                });

                userAnswers[`${cacheKey}_${index}`] = text;
                updateProgressBar();
            };
            return div;
        }

        function renderAll() {
            const container = document.getElementById('partsContainer');
            container.innerHTML = '';
            shuffledOptionsCache = {};
            totalQuestionsCount = 0;

            for (let p = 1; p <= 6; p++) {
                const key = `question${p}_list`;
                if (!data[key] || data[key].length === 0) continue;

                const partHeading = document.createElement('h5');
                partHeading.className = 'part-header d-flex align-items-center gap-2';
                partHeading.innerHTML = `<i class="bi bi-bookmark-star-fill text-primary"></i> Part ${p}`;
                container.appendChild(partHeading);

                data[key].forEach((q, i) => {
                    totalQuestionsCount++;
                    const correct = getCorrectAnswer(q);
                    const cacheKey = `p${p}`;
                    const cacheEntryKey = `${cacheKey}_${i}`;

                    if (!shuffledOptionsCache[cacheEntryKey]) {
                        shuffledOptionsCache[cacheEntryKey] = shuffleArray(getCleanOptions(q));
                    }
                    const options = shuffledOptionsCache[cacheEntryKey];

                    let questionText = q.question_ask || q.question_orginal || q.question_start || "Question";
                    if (q.question_start && q.question_end) {
                        questionText = `${q.question_start} _______ ${q.question_end}`;
                    }

                    const card = document.createElement('div');
                    card.className = 'question-card';

                    const heading = document.createElement('h6');
                    heading.className = 'fw-bold mb-3 fs-6 line-height-base';
                    heading.textContent = `${totalQuestionsCount}. ${questionText}`;
                    card.appendChild(heading);

                    const optionsDiv = document.createElement('div');
                    optionsDiv.className = 'options';

                    options.forEach(opt => {
                        optionsDiv.appendChild(createOption(opt, correct, cacheKey, i));
                    });

                    card.appendChild(optionsDiv);
                    container.appendChild(card);
                });
            }

            updateProgressBar();
        }

        // Xem Điểm
        document.getElementById('scoreBtn').addEventListener('click', () => {
            let score = 0;

            for (let p = 1; p <= 6; p++) {
                const key = `question${p}_list`;
                if (!data[key]) continue;
                data[key].forEach((q, i) => {
                    const correct = getCorrectAnswer(q);
                    if (userAnswers[`p${p}_${i}`] === correct) score++;
                });
            }

            const percentage = totalQuestionsCount > 0 ? Math.round((score / totalQuestionsCount) * 100) : 0;
            
            document.getElementById('modalScoreText').textContent = `${score} / ${totalQuestionsCount}`;
            document.getElementById('modalPercentText').textContent = `Chính xác: ${percentage}%`;
            
            const progressBar = document.getElementById('modalProgressBar');
            progressBar.style.width = `${percentage}%`;
            
            let evaluation = "Cố gắng luyện tập thêm nhé!";
            if (percentage >= 80) evaluation = "🎉 Xuất sắc! Bạn đã nắm rất vững kiến thức!";
            else if (percentage >= 50) evaluation = "👍 Khá tốt! Hãy ôn lại các câu làm sai nhé.";
            document.getElementById('modalEvaluation').textContent = evaluation;

            const scoreModal = new bootstrap.Modal(document.getElementById('scoreModal'));
            scoreModal.show();
        });

        // Reset
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm("Bạn có chắc muốn làm lại toàn bộ bài test?")) {
                userAnswers = {};
                renderAll();
            }
        });

        window.onload = loadData;
    </script>
</body>
</html>
