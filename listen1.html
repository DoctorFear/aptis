<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptis Listening Practice - Questions 1-13</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
        }
        body { 
            background-color: var(--bg-body); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #1e293b;
        }
        .main-card { 
            background: #ffffff; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            border: 1px solid #e2e8f0;
            overflow: hidden; 
        }
        /* Custom Audio Control Bar */
        .audio-bar { 
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); 
            color: white; 
            padding: 16px 24px; 
        }
        .time-display {
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0.9;
        }
        .progress-container {
            cursor: pointer;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-custom {
            height: 100%;
            background: #ffffff;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Question Sidebar List */
        .question-list { 
            max-height: 62vh; 
            overflow-y: auto; 
        }
        .question-item {
            padding: 14px 18px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
        }
        .question-item:hover { 
            background: #f1f5f9; 
        }
        .question-item.active { 
            background: #eff6ff; 
            border-left-color: var(--primary-color);
        }
        
        /* Options Card & Feedback */
        .option-card {
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }
        .option-card:hover {
            border-color: #93c5fd;
            background-color: #f8fafc;
        }
        .option-card.correct {
            border-color: #22c55e !important;
            background-color: #f0fdf4 !important;
            color: #15803d;
            font-weight: 600;
        }
        .option-card.incorrect {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
            color: #b91c1c;
        }

        /* Transcript Box */
        .transcript-box { 
            background: #f8fafc; 
            border: 2px dashed #cbd5e1; 
            border-radius: 14px; 
            padding: 20px; 
            font-size: 0.95rem;
            line-height: 1.6;
            color: #334155;
        }
    </style>
</head>
<body>

    <div class="container py-4" style="max-width: 1100px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold text-primary mb-0"><i class="bi bi-headphones me-2"></i>Aptis Listening Practice</h3>
            <span class="badge bg-primary fs-6 px-3 py-2 rounded-pill">Questions 1 - 13</span>
        </div>

        <div class="main-card">
            <!-- Audio Bar -->
            <div class="audio-bar">
                <div class="row align-items-center g-3">
                    <div class="col-auto d-flex align-items-center gap-2">
                        <button id="skipBackBtn" class="btn btn-outline-light btn-sm rounded-circle" title="Lùi 5 giây">
                            <i class="bi bi-arrow-counterclockwise"></i>
                        </button>
                        <button id="playBtn" class="btn btn-light rounded-circle shadow-sm" style="width: 45px; height: 45px;">
                            <i class="bi bi-play-fill fs-4 text-primary" id="playIcon"></i>
                        </button>
                        <button id="skipForwardBtn" class="btn btn-outline-light btn-sm rounded-circle" title="Tới 5 giây">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>

                    <div class="col">
                        <div class="d-flex justify-content-between text-white-50 mb-1 time-display">
                            <span><strong class="text-white" id="currentNum">1</strong> / <span id="totalNum">0</span></span>
                            <span><span id="currentTime">00:00</span> / <span id="durationTime">00:00</span></span>
                        </div>
                        <div class="progress-container" id="progressContainer">
                            <div class="progress-bar-custom" id="progressBar"></div>
                        </div>
                    </div>
                </div>
                <audio id="audioPlayer" style="display:none;"></audio>
            </div>

            <div class="row g-0">
                <!-- Danh sách câu hỏi bên trái -->
                <div class="col-md-5 border-end">
                    <div class="p-3">
                        <div class="input-group mb-3">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" id="searchInput" class="form-control bg-light border-start-0" placeholder="Tìm kiếm câu hỏi...">
                        </div>
                        <div class="question-list" id="questionList"></div>
                    </div>
                </div>

                <!-- Nội dung câu hỏi bên phải -->
                <div class="col-md-7 d-flex flex-column justify-content-between">
                    <div class="p-4">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <span class="badge bg-primary-subtle text-primary fw-semibold px-3 py-1 rounded-pill" id="questionBadge">Câu 1</span>
                            <button class="btn btn-sm btn-link text-decoration-none" id="resetAnswerBtn"><i class="bi bi-arrow-counterclockwise me-1"></i>Làm lại</button>
                        </div>
                        
                        <h5 id="questionText" class="fw-bold mb-4 text-dark" style="line-height: 1.5;"></h5>
                        
                        <!-- Options Container -->
                        <div id="optionsContainer"></div>
                    </div>

                    <!-- Transcript & Footer Controls -->
                    <div class="px-4 pb-4">
                        <div class="d-flex gap-2 mb-3">
                            <button class="btn btn-outline-secondary w-50 rounded-3" id="prevBtn"><i class="bi bi-chevron-left me-1"></i> Câu trước</button>
                            <button class="btn btn-primary w-50 rounded-3" id="nextBtn">Câu kế tiếp <i class="bi bi-chevron-right ms-1"></i></button>
                        </div>

                        <button class="btn btn-outline-primary w-100 rounded-3" id="transcriptBtn">
                            <i class="bi bi-file-earmark-text me-2"></i>Xem Transcript & Đáp án
                        </button>
                        <div id="transcriptBox" class="transcript-box mt-3" style="display:none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let questions = [];
        let filteredQuestions = [];
        let currentIndex = 0;
        let selectedAnswers = {}; // Lưu đáp án người dùng đã chọn

        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');

        async function loadData() {
            try {
                const res = await fetch('listening_question1_13.json');
                questions = await res.json();
                filteredQuestions = [...questions];
                document.getElementById('totalNum').textContent = questions.length;
                
                renderQuestionList();
                renderCurrent();
            } catch (e) {
                alert("Không tìm thấy file listening_question1_13.json hoặc định dạng không đúng!");
            }
        }

        function renderQuestionList() {
            const list = document.getElementById('questionList');
            list.innerHTML = '';

            if (filteredQuestions.length === 0) {
                list.innerHTML = '<div class="text-center text-muted py-4">Không tìm thấy câu hỏi phù hợp</div>';
                return;
            }

            filteredQuestions.forEach((q, i) => {
                const originalIndex = questions.indexOf(q);
                const isSelected = selectedAnswers[originalIndex] !== undefined;
                const div = document.createElement('div');
                div.className = `question-item ${originalIndex === currentIndex ? 'active' : ''}`;
                
                div.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="fw-semibold text-truncate me-2" style="max-width: 80%;">
                            <span class="text-primary me-1">${originalIndex + 1}.</span> ${q.question}
                        </div>
                        ${isSelected ? '<i class="bi bi-check-circle-fill text-success"></i>' : ''}
                    </div>
                `;
                
                div.onclick = () => { 
                    currentIndex = originalIndex; 
                    renderCurrent(); 
                    renderQuestionList(); 
                };
                list.appendChild(div);
            });
        }

        function renderCurrent() {
            const q = questions[currentIndex];
            if (!q) return;

            document.getElementById('currentNum').textContent = currentIndex + 1;
            document.getElementById('questionBadge').textContent = `Câu ${currentIndex + 1}`;
            document.getElementById('questionText').textContent = q.question;

            // Render Options
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            const userSelected = selectedAnswers[currentIndex];
            const correctAnswer = q.answer || q.correctAnswer; // Tự động nhận diện key đáp án đúng trong JSON

            q.options.forEach((opt, idx) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option-card';
                
                // Hiển thị trạng thái đúng/sai nếu người dùng đã chọn
                if (userSelected !== undefined) {
                    if (opt === correctAnswer) {
                        optDiv.classList.add('correct');
                    } else if (userSelected === opt && userSelected !== correctAnswer) {
                        optDiv.classList.add('incorrect');
                    }
                }

                optDiv.innerHTML = `
                    <div class="form-check w-100 mb-0 pointer-events-none">
                        <input class="form-check-input" type="radio" name="option" id="opt_${idx}" ${userSelected === opt ? 'checked' : ''}>
                        <label class="form-check-label w-100 ms-2" for="opt_${idx}">${opt}</label>
                    </div>
                    ${userSelected !== undefined && opt === correctAnswer ? '<i class="bi bi-check-circle-fill text-success fs-5 ms-auto"></i>' : ''}
                    ${userSelected !== undefined && userSelected === opt && userSelected !== correctAnswer ? '<i class="bi bi-x-circle-fill text-danger fs-5 ms-auto"></i>' : ''}
                `;

                optDiv.onclick = () => {
                    selectedAnswers[currentIndex] = opt;
                    renderCurrent();
                    renderQuestionList();
                };

                container.appendChild(optDiv);
            });

            // Audio Setup
            audio.src = q.audioUrl || '';
            playIcon.className = 'bi bi-play-fill fs-4 text-primary';
            progressBar.style.width = '0%';
            document.getElementById('currentTime').textContent = '00:00';
            
            // Re-hide Transcript khi chuyển câu
            document.getElementById('transcriptBox').style.display = 'none';

            // Disable/Enable Nav Buttons
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === questions.length - 1;
        }

        /* --- Audio Controls --- */
        playBtn.addEventListener('click', () => {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                playIcon.className = 'bi bi-pause-fill fs-4 text-primary';
            } else {
                audio.pause();
                playIcon.className = 'bi bi-play-fill fs-4 text-primary';
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = `${pct}%`;
                document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
                document.getElementById('durationTime').textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => {
            playIcon.className = 'bi bi-play-fill fs-4 text-primary';
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = pos * audio.duration;
            }
        });

        document.getElementById('skipBackBtn').addEventListener('click', () => audio.currentTime = Math.max(0, audio.currentTime - 5));
        document.getElementById('skipForwardBtn').addEventListener('click', () => audio.currentTime = Math.min(audio.duration, audio.currentTime + 5));

        /* --- Transcript --- */
        document.getElementById('transcriptBtn').addEventListener('click', () => {
            const box = document.getElementById('transcriptBox');
            const q = questions[currentIndex];
            const answer = q.answer || q.correctAnswer || "Chưa cập nhật";
            
            box.innerHTML = `
                <div class="mb-2 text-success fw-bold"><i class="bi bi-check2-square me-1"></i>Đáp án đúng: ${answer}</div>
                <div><strong>Transcript:</strong></div>
                <div>${q.transcript || "Không có transcript cho câu hỏi này."}</div>
            `;
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        });

        /* --- Search Feature --- */
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            filteredQuestions = questions.filter(q => q.question.toLowerCase().includes(term));
            renderQuestionList();
        });

        /* --- Reset & Navigation --- */
        document.getElementById('resetAnswerBtn').addEventListener('click', () => {
            delete selectedAnswers[currentIndex];
            renderCurrent();
            renderQuestionList();
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderCurrent();
                renderQuestionList();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderCurrent();
                renderQuestionList();
            }
        });

        function formatTime(sec) {
            if (isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        window.onload = loadData;
    </script>
</body>
</html>
