<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptis Reading Master</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #e0e7ff;
            --bg-app: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Bar Branding */
        .app-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px -5px rgba(0,0,0,0.03);
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
        }

        /* Hero / Stats Panel */
        .dashboard-banner {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: white;
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-top: 24px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(49, 46, 129, 0.3);
        }

        .dashboard-banner::after {
            content: '';
            position: absolute;
            right: -20px;
            bottom: -30px;
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Floating Toolbar */
        .action-toolbar {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 12px 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        /* Card Câu hỏi */
        .question-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-bottom: 20px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .question-card:hover {
            border-color: #cbd5e1;
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.06);
            transform: translateY(-2px);
        }

        .q-badge {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--primary-light);
            color: var(--primary);
            display: inline-block;
            margin-bottom: 16px;
        }

        .q-text-wrapper {
            font-size: 1.1rem;
            line-height: 2;
            color: #334155;
            font-weight: 500;
        }

        /* Gap Custom Select UI */
        .gap-select {
            display: inline-block;
            width: auto;
            min-width: 170px;
            padding: 8px 36px 8px 16px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary-hover);
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            vertical-align: middle;
            margin: 0 4px;
        }

        .gap-select:hover {
            border-color: var(--primary);
            background-color: #ffffff;
        }

        .gap-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            background-color: #ffffff;
        }

        .gap-select.is-filled {
            border-color: var(--primary);
            background-color: #f0fdf4;
            color: #15803d;
        }

        /* Correct / Incorrect UI States */
        .gap-select.state-correct {
            border-color: var(--success) !important;
            background-color: #ecfdf5 !important;
            color: #047857 !important;
        }

        .gap-select.state-wrong {
            border-color: var(--danger) !important;
            background-color: #fef2f2 !important;
            color: #b91c1c !important;
        }

        .feedback-box {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            display: none;
            animation: slideDown 0.25s ease-out;
        }

        .feedback-box.correct {
            background-color: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .feedback-box.wrong {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        /* Buttons */
        .btn-custom-primary {
            background: var(--primary);
            color: white;
            font-weight: 600;
            border-radius: var(--radius-md);
            padding: 8px 20px;
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .btn-custom-primary:hover {
            background: var(--primary-hover);
            color: white;
            transform: translateY(-1px);
        }

        /* Progress Bar */
        .progress {
            height: 8px;
            border-radius: 10px;
            background-color: #e2e8f0;
        }

        .progress-bar {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border-radius: 10px;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 576px) {
            .question-card { padding: 18px; }
            .gap-select { width: 100%; margin: 8px 0; }
            .q-text-wrapper { line-height: 2.2; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="brand-logo">A</div>
                <div>
                    <h6 class="fw-bold mb-0">Aptis Reading Practice</h6>
                    <small class="text-muted">Part 1: Sentence Completion</small>
                </div>
            </div>
            <span class="badge bg-light text-dark border px-3 py-2 rounded-pill fw-semibold" id="total-questions-badge">
                <i class="bi bi-collection me-1 text-primary"></i> 0 Câu hỏi
            </span>
        </div>
    </header>

    <div class="container" style="max-width: 840px;">

        <!-- Hero / Dashboard Banner -->
        <div class="dashboard-banner d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h4 class="fw-bold mb-1">Luyện tập Aptis Part 1</h4>
                <p class="mb-0 text-white-50 fs-7">Chọn từ thích hợp nhất để hoàn thành đoạn văn dưới đây.</p>
            </div>
            <div class="bg-white bg-opacity-10 p-3 rounded-3 text-center border border-white border-opacity-10" style="min-width: 140px;">
                <div class="fs-4 fw-bold" id="completion-text">0/5</div>
                <div class="text-white-50 style-sm" style="font-size: 0.75rem;">ĐÃ HOÀN THÀNH</div>
            </div>
        </div>

        <!-- Progress bar -->
        <div class="mb-4">
            <div class="d-flex justify-content-between fs-7 text-muted fw-semibold mb-1" style="font-size: 0.85rem;">
                <span>Tiến độ trang này</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress">
                <div class="progress-bar" id="page-progress" role="progressbar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Floating Control Toolbar -->
        <div class="action-toolbar d-flex flex-wrap justify-content-between align-items-center gap-3">
            <!-- Pagination Controls -->
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-secondary rounded-2" id="btn-prev" onclick="changePage(-1)">
                    <i class="bi bi-arrow-left"></i>
                </button>
                <select id="page-select" class="form-select form-select-sm fw-bold border-secondary-subtle" onchange="goToPage()" style="width: 130px; cursor:pointer;">
                </select>
                <button class="btn btn-sm btn-outline-secondary rounded-2" id="btn-next" onclick="changePage(1)">
                    <i class="bi bi-arrow-right"></i>
                </button>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-light border fw-semibold text-secondary" onclick="resetPage()">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>Làm lại
                </button>
                <button class="btn btn-sm btn-custom-primary" onclick="checkAllAnswers()">
                    <i class="bi bi-send-check me-1"></i>Nộp bài
                </button>
            </div>
        </div>

        <!-- Score Alert Banner -->
        <div id="score-alert" class="alert border-0 shadow-sm rounded-4 p-3 mb-4" style="display: none;"></div>

        <!-- Container chứa các câu hỏi -->
        <div id="questions-container"></div>

    </div>

    <script>
        let allQuestions = [];
        let currentPage = 0;
        const QUESTIONS_PER_PAGE = 5;

        fetch('question1_data.json')
            .then(res => res.json())
            .then(data => {
                allQuestions = Array.isArray(data) && Array.isArray(data[0]) ? data.flat() : data;
                if (!allQuestions || allQuestions.length === 0) {
                    showError("Không tìm thấy dữ liệu trong file!");
                    return;
                }
                document.getElementById('total-questions-badge').innerHTML = `<i class="bi bi-collection me-1 text-primary"></i> ${allQuestions.length} Câu hỏi`;
                initPageSelector();
                renderPage();
            })
            .catch(err => {
                showError("Lỗi kết nối: Không tìm thấy file <b>question1_data.json</b>");
            });

        function showError(msg) {
            document.getElementById('questions-container').innerHTML = `
                <div class="question-card text-center py-5">
                    <i class="bi bi-exclamation-octagon text-danger display-4"></i>
                    <h5 class="mt-3 fw-bold">${msg}</h5>
                    <p class="text-muted">Hãy chắc chắn file JSON cùng thư mục với tệp HTML này.</p>
                </div>`;
        }

        function initPageSelector() {
            const totalPages = Math.ceil(allQuestions.length / QUESTIONS_PER_PAGE);
            const select = document.getElementById('page-select');
            select.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const option = document.createElement('option');
                option.value = i - 1;
                option.textContent = `Trang ${i} / ${totalPages}`;
                select.appendChild(option);
            }
        }

        function updatePagination() {
            const totalPages = Math.ceil(allQuestions.length / QUESTIONS_PER_PAGE);
            document.getElementById('btn-prev').disabled = currentPage === 0;
            document.getElementById('btn-next').disabled = currentPage === totalPages - 1;
            document.getElementById('page-select').value = currentPage;
        }

        function changePage(delta) {
            currentPage += delta;
            renderPage();
        }

        function goToPage() {
            currentPage = parseInt(document.getElementById('page-select').value);
            renderPage();
        }

        function renderPage() {
            // Hide Score Alert
            document.getElementById('score-alert').style.display = 'none';

            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            const start = currentPage * QUESTIONS_PER_PAGE;
            const end = Math.min(start + QUESTIONS_PER_PAGE, allQuestions.length);
            const pageQuestions = allQuestions.slice(start, end);

            pageQuestions.forEach((q, idx) => {
                const realIndex = start + idx + 1;
                
                let optionsHtml = (q.answerOptions || []).map(opt => 
                    `<option value="${opt}">${opt}</option>`
                ).join('');

                let html = `
                    <div class="question-card" id="q${realIndex}">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="q-badge">CÂU ${realIndex}</span>
                        </div>
                        <div class="q-text-wrapper">
                            <span>${q.questionStart || ''}</span>
                            <select class="gap-select form-select form-select-sm" 
                                    data-correct="${q.correctAnswer || ''}" 
                                    onchange="handleSelectChange(this)">
                                <option value="">--- Chọn ---</option>
                                ${optionsHtml}
                            </select>
                            <span>${q.questionEnd || ''}</span>
                        </div>
                        <div class="feedback-box"></div>
                    </div>`;

                container.innerHTML += html;
            });

            updatePagination();
            updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSelectChange(selectElem) {
            if (selectElem.value !== "") {
                selectElem.classList.add('is-filled');
            } else {
                selectElem.classList.remove('is-filled');
            }
            updateProgress();
        }

        function updateProgress() {
            const selects = document.querySelectorAll('.gap-select');
            let filled = 0;
            selects.forEach(s => { if (s.value !== "") filled++; });

            const percentage = Math.round((filled / selects.length) * 100);
            document.getElementById('page-progress').style.width = percentage + '%';
            document.getElementById('progress-percent').innerText = percentage + '%';
            document.getElementById('completion-text').innerText = `${filled}/${selects.length}`;
        }

        function checkAllAnswers() {
            const selects = document.querySelectorAll('.gap-select');
            let correctCount = 0;

            selects.forEach(select => {
                const correct = (select.getAttribute('data-correct') || '').trim();
                const userVal = select.value.trim();
                const card = select.closest('.question-card');
                const feedback = card.querySelector('.feedback-box');

                select.classList.remove('state-correct', 'state-wrong');
                feedback.classList.remove('correct', 'wrong');

                if (userVal === "") {
                    select.classList.add('state-wrong');
                    feedback.className = "feedback-box wrong";
                    feedback.innerHTML = `<i class="bi bi-exclamation-circle-fill me-2"></i>Chưa chọn câu trả lời! Đáp án đúng: <strong>${correct}</strong>`;
                    feedback.style.display = "block";
                } else if (userVal === correct) {
                    correctCount++;
                    select.classList.add('state-correct');
                    feedback.className = "feedback-box correct";
                    feedback.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>Chính xác! Hoàn hảo.`;
                    feedback.style.display = "block";
                } else {
                    select.classList.add('state-wrong');
                    feedback.className = "feedback-box wrong";
                    feedback.innerHTML = `<i class="bi bi-x-circle-fill me-2"></i>Sai rồi. Đáp án đúng là: <strong>${correct}</strong>`;
                    feedback.style.display = "block";
                }
            });

            // Banner tổng điểm
            const alertBox = document.getElementById('score-alert');
            const total = selects.length;
            
            if (correctCount === total) {
                alertBox.className = "alert bg-success text-white border-0 shadow-sm rounded-4 p-3 mb-4 d-flex align-items-center gap-3";
                alertBox.innerHTML = `<i class="bi bi-trophy-fill display-6"></i><div><h6 class="fw-bold mb-0">Tuyệt vời! Tuyệt đối ${correctCount}/${total}</h6><small>Bạn đã làm đúng tất cả các câu trên trang này.</small></div>`;
            } else {
                alertBox.className = "alert bg-warning bg-opacity-20 border border-warning text-dark rounded-4 p-3 mb-4 d-flex align-items-center gap-3";
                alertBox.innerHTML = `<i class="bi bi-stars display-6 text-warning"></i><div><h6 class="fw-bold mb-0">Kết quả: ${correctCount}/${total} câu đúng</h6><small>Hãy kiểm tra lại những câu bị sai để rút kinh nghiệm nhé!</small></div>`;
            }
            alertBox.style.display = 'flex';
        }

        function resetPage() {
            renderPage();
        }
    </script>
</body>
</html>
