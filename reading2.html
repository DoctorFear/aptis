<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptis Reading Q2 & Q3 - Ordering Master</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #e0e7ff;
            --bg-app: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Bar Branding */
        .app-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px -5px rgba(0,0,0,0.03);
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
        }

        /* Banner Dashboard */
        .dashboard-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            margin-top: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.25);
        }

        /* Floating Toolbar / Pagination */
        .pagination-bar {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 12px 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        /* Sentence Cards & Drag UI */
        .sentence-card {
            background: var(--surface);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: grab; /* Kéo toàn bộ card */
            transition: all 0.2s ease;
            user-select: none;
            position: relative;
        }

        .sentence-card:hover {
            border-color: var(--primary);
            box-shadow: 0 6px 16px -4px rgba(99, 102, 241, 0.12);
            transform: translateY(-2px);
        }

        .sentence-card:active {
            cursor: grabbing;
        }

        /* Drag States */
        .sortable-ghost {
            opacity: 0.3;
            background: var(--primary-light) !important;
            border-style: dashed !important;
            border-color: var(--primary) !important;
        }

        .sortable-drag {
            box-shadow: 0 15px 30px rgba(0,0,0,0.15) !important;
            transform: scale(1.02);
            background: #ffffff !important;
        }

        /* Step Badge */
        .step-badge {
            width: 32px;
            height: 32px;
            background-color: #f1f5f9;
            color: var(--text-muted);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .sentence-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #334155;
            font-weight: 500;
            flex-grow: 1;
        }

        /* Answer Validation States */
        .sentence-card.is-correct {
            border-color: var(--success) !important;
            background-color: #f0fdf4 !important;
        }

        .sentence-card.is-correct .step-badge {
            background-color: var(--success);
            color: white;
        }

        .sentence-card.is-wrong {
            border-color: var(--danger) !important;
            background-color: #fef2f2 !important;
        }

        .sentence-card.is-wrong .step-badge {
            background-color: var(--danger);
            color: white;
        }

        /* Buttons */
        .btn-custom-primary {
            background: var(--primary);
            color: white;
            font-weight: 600;
            border-radius: var(--radius-md);
            padding: 10px 24px;
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .btn-custom-primary:hover {
            background: var(--primary-hover);
            color: white;
            transform: translateY(-1px);
        }

        .action-bar {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-top: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="brand-logo"><i class="bi bi-sort-down"></i></div>
                <div>
                    <h6 class="fw-bold mb-0">Aptis Reading Q2 & Q3</h6>
                    <small class="text-muted">Text Ordering Practice</small>
                </div>
            </div>
            <span class="badge bg-light text-dark border px-3 py-2 rounded-pill fw-semibold" id="total-sets-badge">
                <i class="bi bi-layers me-1 text-primary"></i> 0 Question Sets
            </span>
        </div>
    </header>

    <div class="container" style="max-width: 840px;">

        <!-- Banner -->
        <div class="dashboard-banner d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h4 class="fw-bold mb-1"><i class="bi bi-hand-index-thumb me-2"></i>Sắp xếp đoạn văn</h4>
                <p class="mb-0 text-white-50 fs-7">Nhấn giữ & kéo trực tiếp bất kỳ đâu trên thẻ để di chuyển câu.</p>
            </div>
            <button class="btn btn-outline-light btn-sm rounded-3 fw-semibold" onclick="loadRandomSet()">
                <i class="bi bi-shuffle me-1"></i> Set ngẫu nhiên
            </button>
        </div>

        <!-- Phân Trang Trước / Sau / Chọn Set -->
        <div class="pagination-bar d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary btn-sm rounded-2" id="btn-prev" onclick="changeSet(-1)">
                    <i class="bi bi-chevron-left me-1"></i>Trước
                </button>
                <select id="set-select" class="form-select form-select-sm fw-bold border-secondary-subtle" onchange="goToSet()" style="width: 140px; cursor:pointer;">
                </select>
                <button class="btn btn-outline-secondary btn-sm rounded-2" id="btn-next" onclick="changeSet(1)">
                    Sau<i class="bi bi-chevron-right ms-1"></i>
                </button>
            </div>

            <div class="text-muted fw-semibold fs-7" id="set-indicator">
                Set 1 / 1
            </div>
        </div>

        <!-- Feedback Alert -->
        <div id="status-alert" class="alert border-0 shadow-sm rounded-4 p-3 mb-4" style="display: none;"></div>

        <!-- Question Cards Container -->
        <div id="question-container"></div>

        <!-- Control Action Bar -->
        <div class="action-bar d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div class="d-flex gap-2">
                <button class="btn btn-light border fw-semibold text-secondary" onclick="resetCurrentSet()">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>Đặt lại
                </button>
                <button class="btn btn-outline-primary fw-semibold" onclick="revealAnswer()">
                    <i class="bi bi-eye me-1"></i>Xem đáp án
                </button>
            </div>
            <button class="btn btn-custom-primary" onclick="checkOrder()">
                <i class="bi bi-check2-circle me-1"></i>Kiểm tra kết quả
            </button>
        </div>

    </div>

    <script>
        let jsonData = null;
        let currentSetIndex = 0;
        let originalSets = [];
        let sortable = null;

        function shuffleArray(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function loadQuestions() {
            try {
                const response = await fetch('question_2.json');
                if (!response.ok) throw new Error();
                jsonData = await response.json();
            } catch (err) {
                showError("Không tìm thấy file <b>question_2.json</b>! Vui lòng kiểm tra lại đường dẫn.");
                return;
            }

            originalSets = JSON.parse(JSON.stringify(jsonData.questionSets));
            document.getElementById('total-sets-badge').innerHTML = `<i class="bi bi-layers me-1 text-primary"></i> ${jsonData.questionSets.length} Question Sets`;
            
            initSetSelector();
            loadQuestionSet(0);
        }

        function showError(msg) {
            document.getElementById('question-container').innerHTML = `
                <div class="bg-white border rounded-4 p-5 text-center my-4 shadow-sm">
                    <i class="bi bi-exclamation-triangle text-danger display-4"></i>
                    <h5 class="mt-3 fw-bold">${msg}</h5>
                </div>`;
        }

        function initSetSelector() {
            const select = document.getElementById('set-select');
            select.innerHTML = '';
            for (let i = 0; i < jsonData.questionSets.length; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `Set ${i + 1}`;
                select.appendChild(option);
            }
        }

        function updatePaginationButtons() {
            const totalSets = jsonData.questionSets.length;
            document.getElementById('btn-prev').disabled = currentSetIndex === 0;
            document.getElementById('btn-next').disabled = currentSetIndex === totalSets - 1;
            document.getElementById('set-select').value = currentSetIndex;
            document.getElementById('set-indicator').innerText = `Set ${currentSetIndex + 1} / ${totalSets}`;
        }

        function changeSet(delta) {
            currentSetIndex += delta;
            loadQuestionSet(currentSetIndex);
        }

        function goToSet() {
            currentSetIndex = parseInt(document.getElementById('set-select').value);
            loadQuestionSet(currentSetIndex);
        }

        function loadQuestionSet(index) {
            currentSetIndex = index;
            updatePaginationButtons();
            hideAlert();

            const set = jsonData.questionSets[index];
            const container = document.getElementById('question-container');

            container.innerHTML = `<div id="cardsContainer"></div>`;

            const cardsContainer = document.getElementById('cardsContainer');
            const shuffled = shuffleArray(set);

            shuffled.forEach((sentence, i) => {
                const card = document.createElement('div');
                card.className = "sentence-card";
                card.dataset.text = sentence;
                card.innerHTML = `
                    <div class="step-badge">${i + 1}</div>
                    <div class="sentence-text">${sentence}</div>
                    <div class="status-icon fs-5"></div>
                `;
                cardsContainer.appendChild(card);
            });

            // Initialize SortableJS - Cho phép kéo toàn bộ Thẻ (không chọn handle)
            if (sortable) sortable.destroy();
            sortable = new Sortable(cardsContainer, {
                animation: 200,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                onEnd: function () {
                    updateStepNumbers();
                    hideAlert();
                    clearValidationState();
                }
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateStepNumbers() {
            const cards = document.querySelectorAll('#cardsContainer .sentence-card');
            cards.forEach((card, index) => {
                card.querySelector('.step-badge').innerText = index + 1;
            });
        }

        function clearValidationState() {
            const cards = document.querySelectorAll('#cardsContainer .sentence-card');
            cards.forEach(card => {
                card.classList.remove('is-correct', 'is-wrong');
                card.querySelector('.status-icon').innerHTML = '';
            });
        }

        function checkOrder() {
            const cards = document.querySelectorAll('#cardsContainer .sentence-card');
            const userOrder = Array.from(cards).map(card => card.dataset.text);
            const correctOrder = originalSets[currentSetIndex];

            let correctCount = 0;

            cards.forEach((card, i) => {
                const isItemCorrect = userOrder[i] === correctOrder[i];
                card.classList.remove('is-correct', 'is-wrong');
                
                if (isItemCorrect) {
                    correctCount++;
                    card.classList.add('is-correct');
                    card.querySelector('.status-icon').innerHTML = `<i class="bi bi-check-circle-fill text-success"></i>`;
                } else {
                    card.classList.add('is-wrong');
                    card.querySelector('.status-icon').innerHTML = `<i class="bi bi-x-circle-fill text-danger"></i>`;
                }
            });

            const alertBox = document.getElementById('status-alert');
            const total = correctOrder.length;

            if (correctCount === total) {
                alertBox.className = "alert bg-success text-white border-0 shadow-sm rounded-4 p-3 mb-4 d-flex align-items-center gap-3";
                alertBox.innerHTML = `<i class="bi bi-trophy-fill display-6"></i><div><h6 class="fw-bold mb-0">Hoàn hảo! (${correctCount}/${total})</h6><small>Tất cả các câu đã được sắp xếp chính xác theo thứ tự logic.</small></div>`;
            } else {
                alertBox.className = "alert bg-warning bg-opacity-20 border border-warning text-dark rounded-4 p-3 mb-4 d-flex align-items-center gap-3";
                alertBox.innerHTML = `<i class="bi bi-exclamation-triangle-fill display-6 text-warning"></i><div><h6 class="fw-bold mb-0">Chưa đúng! (${correctCount}/${total} câu đúng vị trí)</h6><small>Các câu bị đánh dấu đỏ đang sai vị trí, hãy kéo thả để điều chỉnh lại nhé.</small></div>`;
            }
            alertBox.style.display = 'flex';
        }

        function revealAnswer() {
            const cardsContainer = document.getElementById('cardsContainer');
            cardsContainer.innerHTML = '';
            const correctOrder = originalSets[currentSetIndex];

            correctOrder.forEach((sentence, i) => {
                const card = document.createElement('div');
                card.className = "sentence-card is-correct";
                card.dataset.text = sentence;
                card.innerHTML = `
                    <div class="step-badge">${i + 1}</div>
                    <div class="sentence-text">${sentence}</div>
                    <div class="status-icon fs-5"><i class="bi bi-check-circle-fill text-success"></i></div>
                `;
                cardsContainer.appendChild(card);
            });

            const alertBox = document.getElementById('status-alert');
            alertBox.className = "alert bg-info bg-opacity-15 border border-info text-dark rounded-4 p-3 mb-4 d-flex align-items-center gap-3";
            alertBox.innerHTML = `<i class="bi bi-info-circle-fill display-6 text-info"></i><div><h6 class="fw-bold mb-0">Đã hiển thị đáp án chuẩn!</h6><small>Bấm "Đặt lại" nếu bạn muốn tự làm lại Set này.</small></div>`;
            alertBox.style.display = 'flex';
        }

        function hideAlert() {
            document.getElementById('status-alert').style.display = 'none';
        }

        function resetCurrentSet() {
            loadQuestionSet(currentSetIndex);
        }

        function loadRandomSet() {
            if (!jsonData) return;
            const randomIndex = Math.floor(Math.random() * jsonData.questionSets.length);
            loadQuestionSet(randomIndex);
        }

        window.onload = loadQuestions;
    </script>
</body>
</html>
